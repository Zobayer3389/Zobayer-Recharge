
name: Build Zobayer Recharge APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Extract project ZIP
        run: |
          unzip -q ZobayerRecharge_Android_Project.zip -d project

      - name: Build APK
        run: |
          ./gradle-8.7/bin/gradle -p project/ZobayerRecharge_Android_Project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zobayer-Recharge-APK
          path: project/ZobayerRecharge_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          
